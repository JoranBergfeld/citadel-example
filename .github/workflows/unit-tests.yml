name: Offline units

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Offline unit gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - name: Install locked project environment
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock -r build-requirements.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Run offline unit gate
        run: python -m unittest discover -s tests/unit -v
